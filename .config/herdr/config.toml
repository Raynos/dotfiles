onboarding = false
[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true

# Don't hijack the clipboard on mouse-select — the selection stays visible, it
# just isn't copied, so an iTerm-side or explicit copy still works and a stray
# drag can't clobber what's already on the clipboard. Pairs with
# [ui.toast.clipboard] enabled = false below. (herdr 0.7.5, #1471)
copy_on_select = false

# Give the expanded sidebar more room than herdr's defaults (26/36). min is
# pinned to 30 on purpose: the width otherwise auto-scales down off short
# workspace names, and set-label.sh's tag cap is measured against a known
# column count. Raising the floor makes that cap deterministic.
sidebar_width = 30
sidebar_min_width = 30
sidebar_max_width = 40

# ─── Sidebar rows ────────────────────────────────────────────────────────────
#
# POLICY (2026-07-26): borrow herdr's MECHANISMS (per-token styling, the token
# vocabulary, rows_by_agent when it earns its place) but the SHAPE is Jake's
# call, settled after A/B-ing this config against stock defaults in a live
# session: a dense identity row plus one full-width row for the custom token,
# for both agents and spaces. Stock's shape -- which spreads the same
# information over more rows -- was tried and rejected as too tall.
#
# So: read `herdr --default-config` when herdr adds a token or a feature, and
# adopt the feature. Do not adopt its row layout.
#
# Stock, for reference (what we are NOT doing):
#   [ui.sidebar.agents] rows = [["state_icon","workspace","tab"], ["agent"]]
#   [ui.sidebar.agents.rows_by_agent]
#     claude = [["state_icon","workspace","tab"],
#               ["terminal_title_stripped"], ["agent"]]
#   [ui.sidebar.spaces] rows = [["state_icon","workspace"],
#                               ["branch","git_status"]]
#
# Deltas that ARE deliberate: sidebar width (30/30/40), row_gap = 1, the two
# custom token rows, `agent` merged into the agents identity row, and no
# rows_by_agent at all.
#
# `$goal` is pane metadata written by claude/set-label.sh via
# `herdr pane report-metadata --token goal=<tag>` (herdr 0.7.x dropped the old
# `--custom-status` chip). A token only renders if a row asks for it by
# `$name`, so these blocks and set-label.sh must stay in sync -- and a row
# whose tokens are all empty vanishes rather than rendering blank, so panes
# with no goal just lose that row. Affects the expanded desktop sidebar only;
# collapsed/mobile keep their own compact layouts. Apply without restarting:
# `herdr server reload-config`.
#
# TOKEN STYLING: herdr accepts { token = "x", fg = "#RRGGBB", bold, dim } per
# occurrence, and "omitted style fields preserve the CONTEXTUAL DEFAULT".
# That last part is the trap: deleting `dim = true` from a row does NOT make it
# bright, because the contextual default for a secondary sidebar row is itself
# a muted gray. `$goal` was left bare and still rendered faint. To actually get
# contrast you must set `fg` AND `dim = false` explicitly.
#
# fg is STRICT HEX ONLY -- no named colors, no palette references. Measured
# WCAG contrast of the gruvbox palette against gruvbox dark0 (#282828) and
# gruvbox-light light0 (#fbf1c7): NOTHING clears 4.5:1 on both. The best
# dual-background colors top out at ~3.8:1 (neutral_orange 3.81/3.41,
# neutral_blue 3.48/3.73, gray 4.02/3.24) -- which is exactly the washed-out
# look that made this config unreadable. Hence [theme] auto_switch is OFF: on
# dark alone, fg1 #ebdbb2 scores 10.75:1, ~2.8x the best compromise color.
# If auto_switch ever comes back, these hexes must go back to neutrals AND the
# readability regression comes back with them. That is the actual trade.
#
# HIERARCHY -- use BOTH axes, which is the mistake this file made twice.
# Tuning only brightness gives you a choice between "too faint" and "identical
# to everything else", because gruvbox's default text IS fg1: setting a custom
# row to #ebdbb2 makes it a clone of `workspace`, and stepping down far enough
# to distinguish it lands back on gray. The ramp and the escape hatch:
#
#   fg0  #fbf1c7  12.99:1
#   fg1  #ebdbb2  10.75:1   default text -- `workspace` uses this
#   fg2  #d5c4a1   8.59:1
#   fg3  #bdae93   6.77:1   `$cwd`
#   fg4  #a89984   5.30:1
#   gray #928374   4.02:1   the original "too dim"
#
# So rank by HUE as well: `$goal` is bright_yellow #fabd2f (8.69:1), which is
# unmistakably not `workspace` while staying brighter than fg3. `$cwd` stays
# neutral at fg3 because it is supporting detail, and that also keeps the two
# custom rows distinct from EACH OTHER -- they were briefly identical, which
# is its own kind of unreadable.
#
# Budget: 4 hues on screen (aqua/orange/yellow + the state icon). Adding more
# is what makes `state_icon` stop reading as the semantic one.
#
# `state_icon` is deliberately left UNSTYLED: herdr colors it by lifecycle
# state (idle/working/blocked/done), so a hardcoded fg would destroy the one
# piece of color in the sidebar that actually carries information.
#
# The global alternative to per-token fg is [theme.custom], which retints the
# theme itself. Its vocabulary (read out of the 0.7.5 binary, catppuccin-style
# names even under gruvbox): accent, panel_bg, surface0, surface1, surface_dim,
# overlay0, overlay1, text, subtext0, mauve, green, yellow, red, blue, teal,
# peach. `subtext0` is the likely driver of muted row text -- untested, so the
# per-token fg below is used instead, which is explicit and certain.
[ui.sidebar.agents]
# row_gap = 1 puts a blank terminal row between entries (0 is herdr's tight
# default). This is a deliberate divergence, and it is the FIRST thing to give
# back if the agent panel gets crowded -- cheaper than dropping a row.
row_gap = 1
# Two rows, by Jake's call (2026-07-26): identity on row 1, `$goal` owning
# row 2. `agent` rides in row 1 rather than taking herdr's own row -- the one
# place we knowingly diverge from the stock shape, because the goal row is
# worth more than the harness name having its own line.
#
# `tab` was dropped from row 1: every workspace here has exactly ONE tab and
# none are named, so herdr's `label` was the literal character "1" on every
# row forever -- a constant, costing columns in a 30-wide sidebar where long
# workspace names ("house priscilla") are what truncate. Put it back if you
# start running multiple tabs per workspace or `herdr tab rename` them.
#
# ⚠️ set-label.sh's 24-char tag cap is measured against THIS layout: `$goal`
# owning a full row, at sidebar_min_width = 30. Change either and re-measure
# the `cut -c1-24` in ~/.claude/set-label.sh.
rows = [
  ["state_icon", { token = "workspace", bold = true }, { token = "agent", fg = "#8ec07c" }],
  [{ token = "$goal", fg = "#fabd2f", bold = true, dim = false }],
]

# No [ui.sidebar.agents.rows_by_agent]. herdr's stock config recommends one for
# claude built around `terminal_title_stripped` (the live terminal title, free,
# no scaffolding) -- trialled 2026-07-26 and rejected: `$goal` is a curated
# headline and the raw title next to it was noise, not signal. Without the
# title row a per-agent override would be byte-identical to `rows` above, i.e.
# dead config, so the whole block is gone. Reinstate from git (dedabdc) if you
# ever want the trial back.

# Built-in space tokens: state_icon, state_text, workspace, branch, git_status.
# There is NO built-in cwd token — `$cwd` is workspace metadata published by
# .config/herdr/herdr-cwd-labels.sh, which polls `herdr api snapshot` because
# herdr fires no events. That script writes the token with a TTL, so if the
# watcher dies this row expires and vanishes rather than showing a stale
# directory. Keep the two in sync: a token with no row renders nothing, silently.
#
# Two rows, mirroring the agents block above: identity on row 1, `$cwd` owning
# row 2. Its own row means a long branch name can no longer eat the path.
#
# ⚠️ `tab` was requested for row 1 and is IMPOSSIBLE here: spaces are
# workspaces and have no single tab. herdr rejects it outright --
#   unknown sidebar token `tab`; custom tokens must start with `$`
# -- and the failure is loud but TOTAL: `herdr config check` reports "issues
# found ... using defaults" and `server reload-config` returns
# status = "partial" / "keeping current ui settings", i.e. ONE bad token in
# ONE row silently discards the ENTIRE ui config, not just that row.
# (Unlike a bad THEME name, which falls back to catppuccin with no diagnostic
# at all. Tokens are validated; theme names are not. Verified 2026-07-26.)
#
# Valid space tokens are exactly: state_icon, state_text, workspace, branch,
# git_status (+ any `$custom` from workspace metadata). `git_status` stands in
# for `tab` here, which also restores the dirty/ahead/behind indicator;
# `state_text` is the other option if the icon alone is too terse.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }, { token = "branch", fg = "#8ec07c" }, { token = "git_status", fg = "#fe8019" }],
  [{ token = "$cwd", fg = "#bdae93", dim = false }],
]

[theme]
# Pinned to gruvbox 2026-07-26, after A/B-ing this config against stock
# defaults. `name = "terminal"` follows the host palette instead of hardcoding
# one -- but that means herdr stops painting its own chrome and inherits
# whichever iTerm profile the session attached under, which flattens the
# accent, borders and navigation UI.
#
# auto_switch was ON for about an hour on 2026-07-26 and is now OFF, because
# it and readability are in direct conflict: a token `fg` is a single literal
# hex, so under auto_switch it has to be legible on BOTH gruvbox dark0
# (#282828) and gruvbox-light light0 (#fbf1c7), and no gruvbox color manages
# 4.5:1 on both -- the ceiling is ~3.8:1. Dark-only lifts the custom rows to
# 10.75:1. Restoring it is one line plus reverting every fg in the sidebar
# blocks to a neutral; the washed-out sidebar comes back with it.
# dark_name/light_name are left here, unused, as the recipe.
#
# The light variants are REAL but UNDOCUMENTED -- the "Built-in themes:" list
# in `herdr --default-config` names only the dark half. Pairs that exist
# (read out of the 0.7.5 binary): catppuccin/catppuccin-latte,
# gruvbox/gruvbox-light, one-dark/one-light, solarized/solarized-light,
# tokyo-night/tokyo-night-day, rose-pine/rose-pine-dawn,
# kanagawa/kanagawa-lotus. dracula, nord and vesper are dark-only.
#
# ⚠️ A misspelled theme name is NOT an error. herdr logs "unknown theme,
# falling back" and silently renders catppuccin, while `herdr config check`
# still prints "config: ok" -- it validates keys, not enum values. The only
# way to verify a theme name is to look at the rendered UI.
name = "gruvbox"
auto_switch = false
# dark_name = "gruvbox"
# light_name = "gruvbox-light"

[ui.toast]
delivery = "herdr"

[ui.toast.clipboard]
enabled = false

[ui.sound]
enabled = false

[update]
channel = "stable"
