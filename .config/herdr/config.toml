onboarding = false
[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true

# Don't hijack the clipboard on mouse-select — the selection stays visible, it
# just isn't copied, so an iTerm-side or explicit copy still works and a stray
# drag can't clobber what's already on the clipboard. Pairs with
# [ui.toast.clipboard] enabled = false below. (herdr 0.7.5, #1471)
copy_on_select = false

# Give the expanded sidebar more room than herdr's defaults (26/36). min is
# pinned to 30 on purpose: the width otherwise auto-scales down off short
# workspace names, and set-label.sh's tag cap is measured against a known
# column count. Raising the floor makes that cap deterministic.
sidebar_width = 30
sidebar_min_width = 30
sidebar_max_width = 40

# ─── Sidebar rows ────────────────────────────────────────────────────────────
#
# POLICY (2026-07-26): track herdr's OWN recommended layout, and diverge in
# exactly three places -- sidebar width, row_gap, and the two custom tokens
# ($goal, $cwd). Everything else here is the stock shape from
# `herdr --default-config`, copied verbatim. When herdr changes its
# recommendation, re-diff against that and re-adopt; do not hand-roll.
#
# The stock shapes this is built from:
#   [ui.sidebar.agents] rows = [["state_icon","workspace","tab"], ["agent"]]
#   [ui.sidebar.agents.rows_by_agent]
#     claude = [["state_icon","workspace","tab"],
#               ["terminal_title_stripped"], ["agent"]]
#   [ui.sidebar.spaces] rows = [["state_icon","workspace"],
#                               ["branch","git_status"]]
#
# `$goal` is pane metadata written by claude/set-label.sh via
# `herdr pane report-metadata --token goal=<tag>` (herdr 0.7.x dropped the old
# `--custom-status` chip). A token only renders if a row asks for it by
# `$name`, so these blocks and set-label.sh must stay in sync -- and a row
# whose tokens are all empty vanishes rather than rendering blank, so panes
# with no goal just lose that row. Affects the expanded desktop sidebar only;
# collapsed/mobile keep their own compact layouts. Apply without restarting:
# `herdr server reload-config`.
#
# TOKEN STYLING: herdr accepts { token = "x", fg = "#RRGGBB", bold, dim } per
# occurrence. fg is STRICT HEX ONLY -- no named colors, no palette references
# -- which fights [theme] auto_switch, because one literal hex has to sit on
# both the gruvbox dark and gruvbox-light backgrounds. So every fg below is a
# gruvbox NEUTRAL, the variant gruvbox publishes precisely for that job.
# Anything tuned for dark alone will look wrong at 06:00 in light mode.
# `state_icon` is deliberately left UNSTYLED: herdr colors it by lifecycle
# state (idle/working/blocked/done), so a hardcoded fg would destroy the one
# piece of color in the sidebar that actually carries information.
[ui.sidebar.agents]
# row_gap = 1 puts a blank terminal row between entries (0 is herdr's tight
# default). This is a deliberate divergence, and it is the FIRST thing to give
# back if the agent panel gets crowded -- cheaper than dropping a row.
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }, { token = "tab", dim = true }],
  [{ token = "agent", fg = "#689d6a" }],
  [{ token = "$goal", dim = true }],
]

# Per-agent overrides. rows_by_agent REPLACES `rows` above for a matching
# agent, so each entry repeats the full layout. Keys are canonical agent IDs;
# only the integrations actually installed here are listed -- `herdr
# integration status` reports claude (v7) and cursor (v1) current, the other
# twelve (pi, omp, codex, copilot, devin, droid, kimi, opencode, kilo, hermes,
# qodercli, mastracode) not installed. An unused key is harmless but is dead
# config; add one when you install its integration.
#
# `terminal_title_stripped` is a herdr BUILT-IN carrying the live terminal
# title -- what the agent is doing right now, for free. It overlaps `$goal`,
# which is a curated <=50-char headline set-label.sh publishes by hand, so
# this is a deliberate side-by-side TRIAL: run both, keep the winner. If the
# built-in wins, `$goal` + the herdr half of set-label.sh + the token/row sync
# hazard all retire together; if it loses, delete the title row.
#
# ⚠️ Cost: a claude entry is now 4 rows + row_gap = 5 terminal rows. That is
# the price of the stock shape (which puts `agent` on its own row) plus both
# the title and goal rows. If that is too tall, the fixes in order are:
# row_gap = 0, then merge `agent` back up into row 1, then drop a row.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "workspace", bold = true }, { token = "tab", dim = true }],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "agent", fg = "#689d6a" }],
  [{ token = "$goal", dim = true }],
]
cursor = [
  ["state_icon", { token = "workspace", bold = true }, { token = "tab", dim = true }],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "agent", fg = "#689d6a" }],
  [{ token = "$goal", dim = true }],
]

# Built-in space tokens: state_icon, state_text, workspace, branch, git_status.
# There is NO built-in cwd token — `$cwd` is workspace metadata published by
# .config/herdr/herdr-cwd-labels.sh, which polls `herdr api snapshot` because
# herdr fires no events. That script writes the token with a TTL, so if the
# watcher dies this row expires and vanishes rather than showing a stale
# directory. Keep the two in sync: a token with no row renders nothing, silently.
#
# $cwd gets its OWN row (stock two rows + ours). It used to share the
# branch/git_status line to save vertical space, but that made it the widest
# row in the sidebar and therefore the first to truncate — a long branch name
# ate the path. Its own row removes that coupling.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "branch", fg = "#689d6a" }, { token = "git_status", fg = "#d65d0e" }],
  [{ token = "$cwd", dim = true }],
]

[theme]
# Pinned to gruvbox 2026-07-26, after A/B-ing this config against stock
# defaults. `name = "terminal"` follows the host palette instead of hardcoding
# one -- but that means herdr stops painting its own chrome and inherits
# whichever iTerm profile the session attached under, which flattens the
# accent, borders and navigation UI. auto_switch buys back the reason
# "terminal" was chosen in the first place: herdr follows the host's
# light/dark appearance and swaps between the two names below.
#
# The light variants are REAL but UNDOCUMENTED -- the "Built-in themes:" list
# in `herdr --default-config` names only the dark half. Pairs that exist
# (read out of the 0.7.5 binary): catppuccin/catppuccin-latte,
# gruvbox/gruvbox-light, one-dark/one-light, solarized/solarized-light,
# tokyo-night/tokyo-night-day, rose-pine/rose-pine-dawn,
# kanagawa/kanagawa-lotus. dracula, nord and vesper are dark-only.
#
# ⚠️ A misspelled theme name is NOT an error. herdr logs "unknown theme,
# falling back" and silently renders catppuccin, while `herdr config check`
# still prints "config: ok" -- it validates keys, not enum values. The only
# way to verify a theme name is to look at the rendered UI.
name = "gruvbox"
auto_switch = true
dark_name = "gruvbox"
light_name = "gruvbox-light"

[ui.toast]
delivery = "herdr"

[ui.toast.clipboard]
enabled = false

[ui.sound]
enabled = false

[update]
channel = "stable"
