# omp -> MTPLX, Qwen3.8-27B on this machine.
#
# `providers.<id>.baseUrl` + `api: openai-completions` is the RUNTIME route for
# an OpenAI-compatible server; it needs no rebuild. The other documented route
# (adding-a-provider.md) is a source change to packages/catalog + packages/ai
# and is not usable from an installed binary.
#
# Ports: MTPLX serves 18091 directly.
#
# Schema: ~/.omp/agent/models.yml, root key `providers` only (unknown root keys
# fail validation). Documented in the packaged docs index, `models.md`.
providers:
  mtplx-local:
    baseUrl: http://127.0.0.1:18091/v1
    api: openai-completions
    # Required. Without it omp refuses the whole file:
    #   'apiKey is required when defining custom models unless auth is
    #    "none" or "oauth"' -- and it disables ALL custom providers, not just
    # this one, so a single bad entry silently costs you the local model.
    auth: none
    models:
      - id: mtplx-qwen38-27b-optimized-speed
        name: Qwen3.8-27B (MTPLX 4-bit, local)
        api: openai-completions
        reasoning: true
        # These weights ARE vision-capable and MTPLX serves the vision tower;
        # `input: [text]` here was under-declaring it, and omp trusts this field
        # rather than probing. The symptom is indirect: `inspect_image` resolves
        # `modelRoles.vision`, finds nothing configured, falls back to the session
        # model, and dies with "does not support image input. Configure a
        # vision-capable model for modelRoles.vision" — which reads like a missing
        # role, not a wrong capability declaration.
        #
        # Evidence it is genuinely vision-capable:
        #   curl -s 127.0.0.1:18091/health | jq .vision
        #     -> {"enabled": true, "formats": ["png","jpeg","webp"]}
        #   model dir has model-vision.safetensors + preprocessor_config.json
        #   config.json: Qwen3_5ForConditionalGeneration, with vision_config,
        #                image_token_id, vision_start_token_id
        #
        # NOTE: `/v1/models` reports `"capability": "chat"` and is misleading here.
        # `/health` is the endpoint that actually reports vision support.
        input: [text, image]
        # Measured on this box, not guessed: 262,144 native context. The bounded
        # xhigh runs used a 120,000-token generation budget and ts-class needed
        # 74,642 tokens, so a 16k default would truncate real work.
        contextWindow: 262144
        maxTokens: 120000
        # Qwen3.8's chat template accepts EXACTLY these three, and `xhigh` is what you
        # get when reasoning_effort is omitted entirely -- which is why this model has a
        # reputation for wildly overthinking out of the box.
        #
        # Without this block omp falls back to its generic ladder and offered
        # `minimal, low, medium, high` for this model: two values the template does not
        # know (`minimal`, `high`) and missing the real top end (`xhigh`). Sending
        # `high` is not a soft failure -- the template raises
        #   TemplateError: Unexpected reasoning effort high.
        #                  Supported types are xhigh (default), medium, and low.
        # which surfaces as an HTTP 500 from the server (QwenLM/Qwen3.8#217, the same
        # bug that stops stock Claude Code talking to this model, since its default
        # effort is `high`).
        #
        # Declaring the real ladder makes omp's `/effort` command and shift+tab cycle
        # match what the model can actually honour.
        thinking:
          mode: effort
          efforts: [low, medium, xhigh]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        compat:
          # The whole point of this stack: `medium` is worth +34 points of
          # correctness here (50% -> 84%) for ~10% of decode speed.
          supportsReasoningEffort: true
