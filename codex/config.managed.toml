# These scalar defaults are applied to ~/.codex/config.toml by install.sh.
# They deliberately exclude project trust, plugin cache, OAuth, and sessions.
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
approvals_reviewer = "auto_review"
service_tier = "default"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[tools.experimental_request_user_input]
enabled = true
